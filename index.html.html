<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DLS Soccer Penalty Master</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background: #0c1017; color: #fff; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        #gameContainer { position: relative; width: 100vw; height: 100vh; max-width: 500px; max-height: 900px; background: linear-gradient(180deg, #101c2e 0%, #1a3323 40%, #155724 100%); overflow: hidden; box-shadow: 0 0 30px rgba(0,255,136,0.2); }
        canvas { display: block; width: 100%; height: 100%; }
        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.6); padding: 12px 20px; border-radius: 15px; border: 1px solid rgba(0, 255, 136, 0.3); backdrop-filter: blur(5px); }
        .score-box { text-align: center; }
        .score-title { font-size: 11px; color: #00ff88; text-transform: uppercase; letter-spacing: 1px; }
        .score-num { font-size: 24px; font-weight: bold; }
        .msg-box { text-align: center; font-size: 28px; font-weight: bold; color: #fff; text-shadow: 0 0 10px rgba(0,0,0,0.8); opacity: 0; transition: opacity 0.3s; margin-top: 50px; }
        .instructions { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 20px; font-size: 14px; color: #00ff88; text-align: center; white-space: nowrap; border: 1px solid rgba(0,255,136,0.3); }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div class="ui-overlay">
        <div class="header">
            <div class="score-box">
                <div class="score-title">Gollar</div>
                <div class="score-num" id="goalsCount">0</div>
            </div>
            <div class="score-box">
                <div class="score-title">Zarbalar</div>
                <div class="score-num" id="shotsCount">0</div>
            </div>
        </div>
        <div class="msg-box" id="msgBox">GOL!</div>
        <div class="instructions">To'pni darvoza tomonga tortib ko'rsating! ⚽</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const goalsEl = document.getElementById('goalsCount');
    const shotsEl = document.getElementById('shotsCount');
    const msgBox = document.getElementById('msgBox');

    let width, height;
    function resize() {
        const container = document.getElementById('gameContainer');
        width = canvas.width = container.clientWidth;
        height = canvas.height = container.clientHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Audio Context (Ovozsiz ishlaydi)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, duration, type='sine') {
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e){}
    }

    let goals = 0;
    let shots = 0;
    let isAiming = false;
    let dragStart = { x: 0, y: 0 };
    let dragCurrent = { x: 0, y: 0 };

    const ball = {
        x: 0, y: 0, z: 0,
        vx: 0, vy: 0, vz: 0,
        radius: 14,
        moving: false
    };

    const keeper = {
        x: 0, y: 0,
        width: 60, height: 40,
        targetX: 0,
        diving: false
    };

    function resetPositions() {
        ball.x = width / 2;
        ball.y = height * 0.78;
        ball.z = 0;
        ball.vx = 0; ball.vy = 0; ball.vz = 0;
        ball.moving = false;

        keeper.x = width / 2;
        keeper.y = height * 0.32;
        keeper.targetX = width / 2;
        keeper.diving = false;
    }
    resetPositions();

    // Controls
    function handleStart(e) {
        if (ball.moving) return;
        const pt = e.touches ? e.touches[0] : e;
        const rect = canvas.getBoundingClientRect();
        dragStart = { x: pt.clientX - rect.left, y: pt.clientY - rect.top };
        dragCurrent = { ...dragStart };
        isAiming = true;
    }

    function handleMove(e) {
        if (!isAiming) return;
        const pt = e.touches ? e.touches[0] : e;
        const rect = canvas.getBoundingClientRect();
        dragCurrent = { x: pt.clientX - rect.left, y: pt.clientY - rect.top };
    }

    function handleEnd() {
        if (!isAiming) return;
        isAiming = false;

        const dx = dragStart.x - dragCurrent.x;
        const dy = dragStart.y - dragCurrent.y;

        if (dy > 30) {
            ball.vx = dx * 0.12;
            ball.vy = -dy * 0.22;
            ball.vz = dy * 0.15;
            ball.moving = true;

            // Keeper AI decision
            const goalLeft = width * 0.22;
            const goalRight = width * 0.78;
            keeper.targetX = goalLeft + Math.random() * (goalRight - goalLeft);
            keeper.diving = true;

            shots++;
            shotsEl.innerText = shots;
            playSound(300, 0.1);
        }
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchstart', handleStart);
    canvas.addEventListener('touchmove', handleMove);
    window.addEventListener('touchend', handleEnd);

    function showMessage(txt, color) {
        msgBox.innerText = txt;
        msgBox.style.color = color;
        msgBox.style.opacity = 1;
        setTimeout(() => { msgBox.style.opacity = 0; }, 1200);
    }

    function update() {
        if (ball.moving) {
            ball.x += ball.vx;
            ball.y += ball.vy;
            ball.z += ball.vz;
            ball.vz -= 0.4; // Gravity

            if (ball.z < 0) ball.z = 0;

            // Keeper movement
            if (keeper.diving) {
                keeper.x += (keeper.targetX - keeper.x) * 0.12;
            }

            // Goal detection
            const goalY = height * 0.3;
            const goalLeft = width * 0.22;
            const goalRight = width * 0.78;

            if (ball.y <= goalY && ball.y > goalY - 30) {
                // Check Keeper Save
                if (Math.abs(ball.x - keeper.x) < 45 && ball.z < 50) {
                    ball.moving = false;
                    showMessage("SEYV!", "#ff4444");
                    playSound(150, 0.3, 'sawtooth');
                    setTimeout(resetPositions, 1500);
                } 
                // Check Goal
                else if (ball.x > goalLeft && ball.x < goalRight && ball.z < 70) {
                    ball.moving = false;
                    goals++;
                    goalsEl.innerText = goals;
                    showMessage("GOOOL!", "#00ff88");
                    playSound(600, 0.4);
                    setTimeout(resetPositions, 1500);
                } 
                // Out
                else {
                    ball.moving = false;
                    showMessage("NOANIQ!", "#ffbb00");
                    playSound(180, 0.2);
                    setTimeout(resetPositions, 1500);
                }
            } else if (ball.y < goalY - 100 || ball.x < 0 || ball.x > width) {
                ball.moving = false;
                showMessage("MAYDONDAN TASHQARI!", "#ffbb00");
                setTimeout(resetPositions, 1500);
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);

        // Field lines
        ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
        ctx.lineWidth = 3;

        // Penalty Box
        const pLeft = width * 0.15;
        const pRight = width * 0.85;
        const pTop = height * 0.3;
        const pBottom = height * 0.6;
        ctx.strokeRect(pLeft, pTop, pRight - pLeft, pBottom - pTop);

        // Goal Post
        const gLeft = width * 0.22;
        const gRight = width * 0.78;
        const gTop = height * 0.22;
        ctx.lineWidth = 6;
        ctx.strokeStyle = "#ffffff";
        ctx.beginPath();
        ctx.moveTo(gLeft, pTop);
        ctx.lineTo(gLeft, gTop);
        ctx.lineTo(gRight, gTop);
        ctx.lineTo(gRight, pTop);
        ctx.stroke();

        // Net pattern
        ctx.lineWidth = 1;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
        for(let x = gLeft; x <= gRight; x += 15) {
            ctx.beginPath(); ctx.moveTo(x, gTop); ctx.lineTo(x, pTop); ctx.stroke();
        }

        // Keeper
        ctx.fillStyle = "#ff0055";
        ctx.shadowColor = "#ff0055";
        ctx.shadowBlur = 10;
        ctx.fillRect(keeper.x - keeper.width/2, keeper.y - keeper.height/2, keeper.width, keeper.height);
        ctx.shadowBlur = 0;

        // Aim line
        if (isAiming) {
            ctx.beginPath();
            ctx.moveTo(dragStart.x, dragStart.y);
            ctx.lineTo(dragCurrent.x, dragCurrent.y);
            ctx.strokeStyle = "#00ff88";
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        // Ball Shadow
        const scale = 1 - (ball.y / height) * 0.3;
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath();
        ctx.ellipse(ball.x, ball.y, ball.radius * scale, (ball.radius / 2) * scale, 0, 0, Math.PI * 2);
        ctx.fill();

        // Ball
        const drawRadius = Math.max(5, (ball.radius - ball.z * 0.08) * scale);
        const drawY = ball.y - ball.z;
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "#ffffff";
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(ball.x, drawY, drawRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Ball pattern
        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.arc(ball.x, drawY, drawRadius * 0.4, 0, Math.PI * 2);
        ctx.fill();

        requestAnimationFrame(() => {
            update();
            draw();
        });
    }

    draw();
</script>
</body>
</html>
